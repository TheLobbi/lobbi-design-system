<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-yellow{fill:var(--color-yellow);stroke:var(--color-yellow);stroke-width:0;}
.c-color-purple-light{fill:var(--color-purple-light);stroke:var(--color-purple-light);stroke-width:0;}
.c-color-blue{fill:var(--color-blue);stroke:var(--color-blue);stroke-width:0;}
.c-color-mint{fill:var(--color-mint);stroke:var(--color-mint);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-gray);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-yellow 8×13 steps, color-purple-light 9×4 steps, color-blue 9×3 steps, color-mint 9×4 steps
  arrangement: one tall slab with satellites
  pattern: stripes — loud, low-formality (4/10) voice → stripes at a spacing pitch
  scales: step space-lg (24px), gap 8px, radius border-radius (2rem)
-->
<rect class="c-color-yellow blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-color-purple-light blk" x="752" y="24" width="208" height="96"/>
<rect class="c-color-blue blk" x="752" y="128" width="208" height="72"/>
<rect class="c-color-mint blk" x="752" y="208" width="208" height="96"/>
<rect class="c-page-bg" x="564" y="12" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="36" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="60" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="84" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="108" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="132" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="156" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="180" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="204" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="228" width="168" height="12"/>
</svg>
<div class="name"><h1><span>Liquid</span><br><span>Motion</span></h1><p>For Animation Studios and Motion Design</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
