<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-orange-500{fill:var(--orange-500);stroke:var(--orange-500);stroke-width:0;}
.c-teal-600{fill:var(--teal-600);stroke:var(--teal-600);stroke-width:0;}
.c-navy-900{fill:var(--navy-900);stroke:var(--navy-900);stroke-width:0;}
.c-gray-300{fill:var(--gray-300);stroke:var(--gray-300);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;top:136px;max-width:880px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:64px;line-height:0.92;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--gray-600);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: orange-500 14×5 steps, teal-600 8×5 steps, navy-900 11×5 steps, gray-300 5×5 steps
  arrangement: top band of unequal strips (name too wide for its zone)
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step spacing-lg (24px), gap 8px, radius radius-sm (0.375rem)
-->
<rect class="c-orange-500 blk" x="0" y="0" width="335" height="112"/>
<rect class="c-teal-600 blk" x="343" y="0" width="198" height="112"/>
<rect class="c-navy-900 blk" x="549" y="0" width="266" height="112"/>
<rect class="c-gray-300 blk" x="823" y="0" width="129" height="112"/>
<circle class="c-page-bg" cx="30" cy="30" r="18"/>
<circle class="c-page-bg" cx="78" cy="30" r="18"/>
<circle class="c-page-bg" cx="126" cy="30" r="18"/>
<circle class="c-page-bg" cx="174" cy="30" r="18"/>
<circle class="c-page-bg" cx="222" cy="30" r="18"/>
<circle class="c-page-bg" cx="270" cy="30" r="18"/>
<circle class="c-page-bg" cx="30" cy="78" r="18"/>
<circle class="c-page-bg" cx="78" cy="78" r="18"/>
<circle class="c-page-bg" cx="126" cy="78" r="18"/>
<circle class="c-page-bg" cx="174" cy="78" r="18"/>
<circle class="c-page-bg" cx="222" cy="78" r="18"/>
<circle class="c-page-bg" cx="270" cy="78" r="18"/>
</svg>
<div class="name"><h1><span>Professional Network</span></h1><p>Professional Network 80% + Career Excellence 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 880, min = 32;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
