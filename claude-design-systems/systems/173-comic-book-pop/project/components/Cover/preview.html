<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Comic+Neue:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-zoom-blue{fill:var(--color-zoom-blue);stroke:var(--color-zoom-blue);stroke-width:0;}
.c-color-kapow-yellow{fill:var(--color-kapow-yellow);stroke:var(--color-kapow-yellow);stroke-width:0;}
.c-color-pow-red{fill:var(--color-pow-red);stroke:var(--color-pow-red);stroke-width:0;}
.c-color-ink-black{fill:var(--color-ink-black);stroke:var(--color-ink-black);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:0px;}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:83px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-zoom-blue 19×4 steps, color-kapow-yellow 16×4 steps, color-pow-red 13×4 steps, color-ink-black 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: stripes — loud, low-formality (3/10) voice → stripes at a spacing pitch
  scales: step space-md (24px), gap 8px, radius none
-->
<rect class="c-color-zoom-blue blk" x="528" y="24" width="456" height="96"/>
<rect class="c-color-kapow-yellow blk" x="600" y="77" width="384" height="96"/>
<rect class="c-color-pow-red blk" x="672" y="130" width="312" height="96"/>
<rect class="c-color-ink-black blk" x="744" y="182" width="240" height="96"/>
<rect class="c-page-bg" x="540" y="36" width="408" height="12"/>
<rect class="c-page-bg" x="540" y="60" width="408" height="12"/>
<rect class="c-page-bg" x="540" y="84" width="408" height="12"/>
</svg>
<div class="name"><h1><span>Comic</span><br><span>Book Pop</span></h1><p>Comic Art 55% + Pop Culture 25% + Bold Graphic 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
