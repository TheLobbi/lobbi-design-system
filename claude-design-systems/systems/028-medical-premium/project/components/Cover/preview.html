<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-logo-bg{fill:var(--logo-bg);stroke:var(--logo-bg);stroke-width:0;}
.c-stat-icon-text{fill:var(--stat-icon-text);stroke:var(--stat-icon-text);stroke-width:0;}
.c-status-badge-text{fill:var(--status-badge-text);stroke:var(--status-badge-text);stroke-width:0;}
.c-soft-green{fill:var(--soft-green);stroke:var(--soft-green);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-8);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:95px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: logo-bg 6×13 steps, stat-icon-text 4×11 steps, status-badge-text 3×13 steps, soft-green 5×11 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step space-24 (24px), gap 8px, radius radius-8 (8px)
-->
<rect class="c-logo-bg blk" x="816" y="-24" width="136" height="312"/>
<rect class="c-stat-icon-text blk" x="720" y="48" width="88" height="264"/>
<rect class="c-status-badge-text blk" x="648" y="-24" width="64" height="312"/>
<rect class="c-soft-green blk" x="528" y="48" width="112" height="264"/>
<circle class="c-page-bg" cx="846" cy="30" r="18"/>
<circle class="c-page-bg" cx="894" cy="30" r="18"/>
<circle class="c-page-bg" cx="846" cy="78" r="18"/>
<circle class="c-page-bg" cx="894" cy="78" r="18"/>
<circle class="c-page-bg" cx="846" cy="126" r="18"/>
<circle class="c-page-bg" cx="894" cy="126" r="18"/>
<circle class="c-page-bg" cx="846" cy="174" r="18"/>
<circle class="c-page-bg" cx="894" cy="174" r="18"/>
<circle class="c-page-bg" cx="846" cy="222" r="18"/>
<circle class="c-page-bg" cx="894" cy="222" r="18"/>
</svg>
<div class="name"><h1><span>Medical</span><br><span>Premium</span></h1><p>Medical Premium 75% + Clean Technology 25%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
