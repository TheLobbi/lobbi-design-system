<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600;700&amp;family=Jost:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-gold-light{fill:var(--color-gold-light);stroke:var(--color-gold-light);stroke-width:0;}
.c-color-marble-vein{fill:var(--color-marble-vein);stroke:var(--color-marble-vein);stroke-width:0;}
.c-color-charcoal{fill:var(--color-charcoal);stroke:var(--color-charcoal);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-gold-light 8×14 steps, color-marble-vein 10×4 steps, color-charcoal 10×3 steps
  arrangement: one tall slab with satellites
  pattern: rules — formal (9/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-lg (22.624px), gap 8px, radius radius-sm (4px)
-->
<rect class="c-color-gold-light blk" x="548" y="-23" width="181" height="311"/>
<rect class="c-color-marble-vein blk" x="737" y="23" width="223" height="90"/>
<rect class="c-color-charcoal blk" x="737" y="121" width="223" height="68"/>
<line class="c-color-marble-vein rule" x1="480" y1="45.248" x2="960" y2="45.248"/>
<line class="c-color-marble-vein rule" x1="480" y1="90.496" x2="960" y2="90.496"/>
<line class="c-color-marble-vein rule" x1="480" y1="135.744" x2="960" y2="135.744"/>
<line class="c-color-marble-vein rule" x1="480" y1="180.992" x2="960" y2="180.992"/>
</svg>
<div class="name"><h1><span>Marble</span><br><span>Luxury</span></h1><p>For Luxury Interior and High-End Design</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
