<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-phase-pre-production-bg{fill:var(--phase-pre-production-bg);stroke:var(--phase-pre-production-bg);stroke-width:0;}
.c-phase-post-production-bg{fill:var(--phase-post-production-bg);stroke:var(--phase-post-production-bg);stroke-width:0;}
.c-phase-distribution-bg{fill:var(--phase-distribution-bg);stroke:var(--phase-distribution-bg);stroke-width:0;}
.c-red-carpet{fill:var(--red-carpet);stroke:var(--red-carpet);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.tile{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: phase-pre-production-bg 6×15 steps, phase-post-production-bg 4×13 steps, phase-distribution-bg 3×15 steps, red-carpet 5×13 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: tiles — geometric, modular dashboard layouts → tiles cut by the radius tokens
  scales: step space-md (20px), gap 7px, radius border-radius (6px)
-->
<rect class="c-phase-pre-production-bg blk" x="840" y="-20" width="113" height="308"/>
<rect class="c-phase-post-production-bg blk" x="760" y="40" width="73" height="268"/>
<rect class="c-phase-distribution-bg blk" x="700" y="-20" width="53" height="308"/>
<rect class="c-red-carpet blk" x="600" y="40" width="93" height="268"/>
<rect class="c-page-bg tile" x="850" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="882" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="914" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="42" width="57" height="25"/>
<rect class="c-page-bg tile" x="914" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="882" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="914" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="106" width="57" height="25"/>
<rect class="c-page-bg tile" x="914" y="106" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="138" width="25" height="25"/>
<rect class="c-page-bg tile" x="882" y="138" width="25" height="25"/>
<rect class="c-page-bg tile" x="914" y="138" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="170" width="57" height="25"/>
<rect class="c-page-bg tile" x="914" y="170" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="202" width="25" height="25"/>
<rect class="c-page-bg tile" x="882" y="202" width="25" height="25"/>
<rect class="c-page-bg tile" x="914" y="202" width="25" height="25"/>
<rect class="c-page-bg tile" x="850" y="234" width="57" height="25"/>
<rect class="c-page-bg tile" x="914" y="234" width="25" height="25"/>
</svg>
<div class="name"><h1><span>Film</span><br><span>Studio</span></h1><p>Film Studio 80% + Cinematic Drama 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
