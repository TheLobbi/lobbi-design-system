<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-champagne-gold{fill:var(--champagne-gold);stroke:var(--champagne-gold);stroke-width:0;}
.c-stat-change-text-2{fill:var(--stat-change-text-2);stroke:var(--stat-change-text-2);stroke-width:0;}
.c-stat-change-text{fill:var(--stat-change-text);stroke:var(--stat-change-text);stroke-width:0;}
.c-charcoal{fill:var(--charcoal);stroke:var(--charcoal);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:0px;}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:73px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: champagne-gold 8×19 steps, stat-change-text-2 19×4 steps, stat-change-text 19×3 steps, charcoal 19×4 steps
  arrangement: one tall slab with satellites
  pattern: rules — formal (9/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-sm (16px), gap 5px, radius none
-->
<rect class="c-champagne-gold blk" x="528" y="-16" width="128" height="304"/>
<rect class="c-stat-change-text-2 blk" x="661" y="16" width="299" height="64"/>
<rect class="c-stat-change-text blk" x="661" y="85" width="299" height="48"/>
<rect class="c-charcoal blk" x="661" y="138" width="299" height="64"/>
<line class="c-stat-change-text-2 rule" x1="480" y1="32" x2="960" y2="32"/>
<line class="c-stat-change-text-2 rule" x1="480" y1="64" x2="960" y2="64"/>
<line class="c-stat-change-text-2 rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-stat-change-text-2 rule" x1="480" y1="128" x2="960" y2="128"/>
</svg>
<div class="name"><h1><span>Wealth</span><br><span>Management</span></h1><p>Wealth Management 75% + Art Deco Elegance 25%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
