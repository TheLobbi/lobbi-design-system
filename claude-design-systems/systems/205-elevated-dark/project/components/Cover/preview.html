<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-amber{fill:var(--color-amber);stroke:var(--color-amber);stroke-width:0;}
.c-color-secondary{fill:var(--color-secondary);stroke:var(--color-secondary);stroke-width:0;}
.c-color-primary{fill:var(--color-primary);stroke:var(--color-primary);stroke-width:0;}
.c-color-pink{fill:var(--color-pink);stroke:var(--color-pink);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:83px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-text-secondary);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-amber 6×13 steps, color-secondary 4×11 steps, color-primary 3×13 steps, color-pink 5×11 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step spacing-lg (24px), gap 8px, radius radius-sm (0.5rem)
-->
<rect class="c-color-amber blk" x="816" y="-24" width="136" height="312"/>
<rect class="c-color-secondary blk" x="720" y="48" width="88" height="264"/>
<rect class="c-color-primary blk" x="648" y="-24" width="64" height="312"/>
<rect class="c-color-pink blk" x="528" y="48" width="112" height="264"/>
<circle class="c-page-bg" cx="846" cy="30" r="18"/>
<circle class="c-page-bg" cx="894" cy="30" r="18"/>
<circle class="c-page-bg" cx="846" cy="78" r="18"/>
<circle class="c-page-bg" cx="894" cy="78" r="18"/>
<circle class="c-page-bg" cx="846" cy="126" r="18"/>
<circle class="c-page-bg" cx="894" cy="126" r="18"/>
<circle class="c-page-bg" cx="846" cy="174" r="18"/>
<circle class="c-page-bg" cx="894" cy="174" r="18"/>
<circle class="c-page-bg" cx="846" cy="222" r="18"/>
<circle class="c-page-bg" cx="894" cy="222" r="18"/>
</svg>
<div class="name"><h1><span>Elevated</span><br><span>Dark</span></h1><p>Elevated Dark 55% + Material Dark 25% + Layered Shadows 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
