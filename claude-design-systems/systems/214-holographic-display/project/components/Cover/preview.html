<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&amp;family=Source+Sans+Pro:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-refraction-blue{fill:var(--color-refraction-blue);stroke:var(--color-refraction-blue);stroke-width:0;}
.c-color-cyan-glow{fill:var(--color-cyan-glow);stroke:var(--color-cyan-glow);stroke-width:0;}
.c-color-spectrum-purple{fill:var(--color-spectrum-purple);stroke:var(--color-spectrum-purple);stroke-width:0;}
.c-color-dark-text{fill:var(--color-dark-text);stroke:var(--color-dark-text);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;top:136px;max-width:880px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:64px;line-height:0.92;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">

  scales: step spacing-md (28px), gap 9px, radius border-radius-sm (8px)
-->

</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 880, min = 32;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
