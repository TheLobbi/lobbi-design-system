<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-service-navy-light{fill:var(--service-navy-light);stroke:var(--service-navy-light);stroke-width:0;}
.c-service-navy-dark{fill:var(--service-navy-dark);stroke:var(--service-navy-dark);stroke-width:0;}
.c-excellence-gold-dark{fill:var(--excellence-gold-dark);stroke:var(--excellence-gold-dark);stroke-width:0;}
.c-excellence-gold-light{fill:var(--excellence-gold-light);stroke:var(--excellence-gold-light);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.tile{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;top:136px;max-width:880px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:53px;line-height:0.92;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-secondary);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: service-navy-light 17×6 steps, service-navy-dark 10×6 steps, excellence-gold-dark 13×6 steps, excellence-gold-light 7×6 steps
  arrangement: top band of unequal strips (name too wide for its zone)
  pattern: tiles — geometric, modular dashboard layouts → tiles cut by the radius tokens
  scales: step space-md (20px), gap 7px, radius radius-sm (4px)
-->
<rect class="c-service-navy-light blk" x="0" y="0" width="336" height="112"/>
<rect class="c-service-navy-dark blk" x="343" y="0" width="199" height="112"/>
<rect class="c-excellence-gold-dark blk" x="549" y="0" width="267" height="112"/>
<rect class="c-excellence-gold-light blk" x="823" y="0" width="130" height="112"/>
<rect class="c-page-bg tile" x="10" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="42" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="74" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="106" y="10" width="57" height="25"/>
<rect class="c-page-bg tile" x="170" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="202" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="234" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="266" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="298" y="10" width="25" height="25"/>
<rect class="c-page-bg tile" x="10" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="42" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="74" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="106" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="138" y="42" width="57" height="25"/>
<rect class="c-page-bg tile" x="202" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="234" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="266" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="298" y="42" width="25" height="25"/>
<rect class="c-page-bg tile" x="10" y="74" width="57" height="25"/>
<rect class="c-page-bg tile" x="74" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="106" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="138" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="170" y="74" width="25" height="25"/>
<rect class="c-page-bg tile" x="202" y="74" width="57" height="25"/>
</svg>
<div class="name"><h1><span>Public Service Excellence</span></h1><p>For Public Services and Government Excellence</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 880, min = 32;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
