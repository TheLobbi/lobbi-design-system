<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Lora:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-highlight{fill:var(--color-highlight);stroke:var(--color-highlight);stroke-width:0;}
.c-color-accent-brown{fill:var(--color-accent-brown);stroke:var(--color-accent-brown);stroke-width:0;}
.c-color-soft-gray{fill:var(--color-soft-gray);stroke:var(--color-soft-gray);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.tile{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-highlight 8×13 steps, color-accent-brown 9×4 steps, color-soft-gray 9×3 steps
  arrangement: one tall slab with satellites
  pattern: tiles — geometric, modular dashboard layouts → tiles cut by the radius tokens
  scales: step space-lg (24px), gap 8px, radius radius-sm (2px)
-->
<rect class="c-color-highlight blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-color-accent-brown blk" x="752" y="24" width="208" height="96"/>
<rect class="c-color-soft-gray blk" x="752" y="128" width="208" height="72"/>
<rect class="c-page-bg tile" x="564" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="602" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="640" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="678" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="564" y="50" width="30" height="30"/>

<div class="name"><h1><span>Paper</span><br><span>Texture</span></h1><p>Paper Material 55% + Print Design 25% + Tactile Craft 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
