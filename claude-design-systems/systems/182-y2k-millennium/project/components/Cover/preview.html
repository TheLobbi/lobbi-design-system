<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&amp;family=Titillium+Web:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-primary{fill:var(--color-primary);stroke:var(--color-primary);stroke-width:0;}
.c-color-secondary{fill:var(--color-secondary);stroke:var(--color-secondary);stroke-width:0;}
.c-color-accent{fill:var(--color-accent);stroke:var(--color-accent);stroke-width:0;}
.c-color-muted{fill:var(--color-muted);stroke:var(--color-muted);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:66px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-primary 19×4 steps, color-secondary 16×4 steps, color-accent 13×4 steps, color-muted 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: stripes — loud, low-formality (4/10) voice → stripes at a spacing pitch
  scales: step space-3 (24px), gap 8px, radius radius-sm (8px)
-->
<rect class="c-color-primary blk" x="528" y="24" width="456" height="96"/>
<rect class="c-color-secondary blk" x="600" y="77" width="384" height="96"/>
<rect class="c-color-accent blk" x="672" y="130" width="312" height="96"/>
<rect class="c-color-muted blk" x="744" y="182" width="240" height="96"/>
<rect class="c-page-bg" x="540" y="36" width="408" height="12"/>
<rect class="c-page-bg" x="540" y="60" width="408" height="12"/>
<rect class="c-page-bg" x="540" y="84" width="408" height="12"/>
</svg>
<div class="name"><h1><span>Y2K</span><br><span>Millennium</span></h1><p>Y2K Aesthetic 55% + Cyber Chrome 25% + Bubble Interface 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
