<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&amp;family=Open+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-sensor-blue{fill:var(--color-sensor-blue);stroke:var(--color-sensor-blue);stroke-width:0;}
.c-color-charging-amber{fill:var(--color-charging-amber);stroke:var(--color-charging-amber);stroke-width:0;}
.c-color-deep-black{fill:var(--color-deep-black);stroke:var(--color-deep-black);stroke-width:0;}
.c-color-text-secondary{fill:var(--color-text-secondary);stroke:var(--color-text-secondary);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:66px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-road-gray);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-sensor-blue 8×13 steps, color-charging-amber 9×4 steps, color-deep-black 9×3 steps, color-text-secondary 9×4 steps
  arrangement: one tall slab with satellites
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step spacing-md (24px), gap 8px, radius border-radius-sm (6px)
-->
<rect class="c-color-sensor-blue blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-color-charging-amber blk" x="752" y="24" width="208" height="96"/>
<rect class="c-color-deep-black blk" x="752" y="128" width="208" height="72"/>
<rect class="c-color-text-secondary blk" x="752" y="208" width="208" height="96"/>
<circle class="c-page-bg" cx="582" cy="30" r="18"/>
<circle class="c-page-bg" cx="630" cy="30" r="18"/>
<circle class="c-page-bg" cx="678" cy="30" r="18"/>
<circle class="c-page-bg" cx="582" cy="78" r="18"/>
<circle class="c-page-bg" cx="630" cy="78" r="18"/>
<circle class="c-page-bg" cx="678" cy="78" r="18"/>
<circle class="c-page-bg" cx="582" cy="126" r="18"/>
<circle class="c-page-bg" cx="630" cy="126" r="18"/>
<circle class="c-page-bg" cx="678" cy="126" r="18"/>
<circle class="c-page-bg" cx="582" cy="174" r="18"/>
<circle class="c-page-bg" cx="630" cy="174" r="18"/>
<circle class="c-page-bg" cx="678" cy="174" r="18"/>
</svg>
<div class="name"><h1><span>Autonomous</span><br><span>Mobility</span></h1><p>For Autonomous Vehicles and EV Companies</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
