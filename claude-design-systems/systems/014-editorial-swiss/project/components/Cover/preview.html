<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-accent{fill:var(--accent);stroke:var(--accent);stroke-width:0;}
.c-black{fill:var(--black);stroke:var(--black);stroke-width:0;}
.c-gray-700{fill:var(--gray-700);stroke:var(--gray-700);stroke-width:0;}
.c-gray-500{fill:var(--gray-500);stroke:var(--gray-500);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:0px;}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:87px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--gray-900);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: accent 19×4 steps, black 16×4 steps, gray-700 13×4 steps, gray-500 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: rules — formal (8/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-24 (24px), gap 8px, radius none
-->
<rect class="c-accent blk" x="528" y="24" width="456" height="96"/>
<rect class="c-black blk" x="600" y="77" width="384" height="96"/>
<rect class="c-gray-700 blk" x="672" y="130" width="312" height="96"/>
<rect class="c-gray-500 blk" x="744" y="182" width="240" height="96"/>
<line class="c-black rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-black rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-black rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-black rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>Editorial</span><br><span>Swiss</span></h1><p>Editorial 65% + Swiss 35%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
