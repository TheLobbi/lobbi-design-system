<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-orange-bright{fill:var(--color-orange-bright);stroke:var(--color-orange-bright);stroke-width:0;}
.c-color-purple-light{fill:var(--color-purple-light);stroke:var(--color-purple-light);stroke-width:0;}
.c-color-blue-light{fill:var(--color-blue-light);stroke:var(--color-blue-light);stroke-width:0;}
.c-color-nebula-purple{fill:var(--color-nebula-purple);stroke:var(--color-nebula-purple);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:83px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-orange-bright 8×13 steps, color-purple-light 9×4 steps, color-blue-light 9×3 steps, color-nebula-purple 9×4 steps
  arrangement: one tall slab with satellites
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step spacing-md (24px), gap 8px, radius radius-sm (4px)
-->
<rect class="c-color-orange-bright blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-color-purple-light blk" x="752" y="24" width="208" height="96"/>
<rect class="c-color-blue-light blk" x="752" y="128" width="208" height="72"/>
<rect class="c-color-nebula-purple blk" x="752" y="208" width="208" height="96"/>
<circle class="c-page-bg" cx="582" cy="30" r="18"/>
<circle class="c-page-bg" cx="630" cy="30" r="18"/>
<circle class="c-page-bg" cx="678" cy="30" r="18"/>
<circle class="c-page-bg" cx="582" cy="78" r="18"/>
<circle class="c-page-bg" cx="630" cy="78" r="18"/>
<circle class="c-page-bg" cx="678" cy="78" r="18"/>
<circle class="c-page-bg" cx="582" cy="126" r="18"/>
<circle class="c-page-bg" cx="630" cy="126" r="18"/>
<circle class="c-page-bg" cx="678" cy="126" r="18"/>
<circle class="c-page-bg" cx="582" cy="174" r="18"/>
<circle class="c-page-bg" cx="630" cy="174" r="18"/>
<circle class="c-page-bg" cx="678" cy="174" r="18"/>
</svg>
<div class="name"><h1><span>Space</span><br><span>Commerce</span></h1><p>For Space Commerce and Aerospace Trade</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
