<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Nunito:wght@300;400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-orange{fill:var(--color-orange);stroke:var(--color-orange);stroke-width:0;}
.c-color-pink{fill:var(--color-pink);stroke:var(--color-pink);stroke-width:0;}
.c-color-pink-light{fill:var(--color-pink-light);stroke:var(--color-pink-light);stroke-width:0;}
.c-color-yellow-dark{fill:var(--color-yellow-dark);stroke:var(--color-yellow-dark);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-text-light);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-orange 6×13 steps, color-pink 4×11 steps, color-pink-light 3×13 steps, color-yellow-dark 5×11 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: stripes — loud, low-formality (2/10) voice → stripes at a spacing pitch
  scales: step spacing-md (24px), gap 8px, radius radius-sm (12px)
-->
<rect class="c-color-orange blk" x="816" y="-24" width="136" height="312"/>
<rect class="c-color-pink blk" x="720" y="48" width="88" height="264"/>
<rect class="c-color-pink-light blk" x="648" y="-24" width="64" height="312"/>
<rect class="c-color-yellow-dark blk" x="528" y="48" width="112" height="264"/>
<rect class="c-page-bg" x="828" y="12" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="36" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="60" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="84" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="108" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="132" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="156" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="180" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="204" width="112" height="12"/>
<rect class="c-page-bg" x="828" y="228" width="112" height="12"/>
</svg>
<div class="name"><h1><span>Casual</span><br><span>Mobile</span></h1><p>For Mobile Games and Casual Gaming</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
