<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Source+Sans+Pro:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-copper-600{fill:var(--copper-600);stroke:var(--copper-600);stroke-width:0;}
.c-burgundy-900{fill:var(--burgundy-900);stroke:var(--burgundy-900);stroke-width:0;}
.c-gold-400{fill:var(--gold-400);stroke:var(--gold-400);stroke-width:0;}
.c-navy-900{fill:var(--navy-900);stroke:var(--navy-900);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-6);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: copper-600 19×4 steps, burgundy-900 16×4 steps, gold-400 13×4 steps, navy-900 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: rules — formal (8/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-24 (24px), gap 8px, radius radius-6 (6px)
-->
<rect class="c-copper-600 blk" x="528" y="24" width="456" height="96"/>
<rect class="c-burgundy-900 blk" x="600" y="77" width="384" height="96"/>
<rect class="c-gold-400 blk" x="672" y="130" width="312" height="96"/>
<rect class="c-navy-900 blk" x="744" y="182" width="240" height="96"/>
<line class="c-burgundy-900 rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-burgundy-900 rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-burgundy-900 rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-burgundy-900 rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>Persian</span><br><span>Carpet</span></h1><p>Artisan Craftsmanship &amp; Endless Gardens</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
