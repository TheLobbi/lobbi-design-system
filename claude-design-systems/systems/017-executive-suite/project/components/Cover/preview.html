<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-emerald-dark{fill:var(--emerald-dark);stroke:var(--emerald-dark);stroke-width:0;}
.c-emerald-light{fill:var(--emerald-light);stroke:var(--emerald-light);stroke-width:0;}
.c-charcoal{fill:var(--charcoal);stroke:var(--charcoal);stroke-width:0;}
.c-text-muted{fill:var(--text-muted);stroke:var(--text-muted);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.tile{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:74px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-secondary);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: emerald-dark 19×4 steps, emerald-light 16×4 steps, charcoal 13×4 steps, text-muted 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: tiles — geometric, modular dashboard layouts → tiles cut by the radius tokens
  scales: step space-3 (24px), gap 8px, radius radius-sm (6px)
-->
<rect class="c-emerald-dark blk" x="528" y="24" width="456" height="96"/>
<rect class="c-emerald-light blk" x="600" y="77" width="384" height="96"/>
<rect class="c-charcoal blk" x="672" y="130" width="312" height="96"/>
<rect class="c-text-muted blk" x="744" y="182" width="240" height="96"/>
<rect class="c-page-bg tile" x="540" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="578" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="616" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="654" y="36" width="68" height="30"/>
<rect class="c-page-bg tile" x="730" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="768" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="806" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="844" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="882" y="36" width="30" height="30"/>
<rect class="c-page-bg tile" x="540" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="578" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="616" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="654" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="692" y="74" width="68" height="30"/>
<rect class="c-page-bg tile" x="768" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="806" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="844" y="74" width="30" height="30"/>
<rect class="c-page-bg tile" x="882" y="74" width="30" height="30"/>
</svg>
<div class="name"><h1><span>Executive</span><br><span>Suite</span></h1><p>Executive Suite 65% + Material Design 3 35%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
