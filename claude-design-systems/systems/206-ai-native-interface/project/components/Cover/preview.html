<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-light-purple{fill:var(--color-light-purple);stroke:var(--color-light-purple);stroke-width:0;}
.c-color-gradient-end{fill:var(--color-gradient-end);stroke:var(--color-gradient-end);stroke-width:0;}
.c-color-deep-purple{fill:var(--color-deep-purple);stroke:var(--color-deep-purple);stroke-width:0;}
.c-color-text-dark{fill:var(--color-text-dark);stroke:var(--color-text-dark);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:74px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-dark-gray);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-light-purple 23×4 steps, color-gradient-end 20×4 steps, color-deep-purple 17×4 steps, color-text-dark 14×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step spacing-unit (20px), gap 7px, radius border-radius-sm (8px)
-->
<rect class="c-color-light-purple blk" x="520" y="20" width="460" height="80"/>
<rect class="c-color-gradient-end blk" x="580" y="64" width="400" height="80"/>
<rect class="c-color-deep-purple blk" x="640" y="108" width="340" height="80"/>
<rect class="c-color-text-dark blk" x="700" y="152" width="280" height="80"/>
<circle class="c-page-bg" cx="545" cy="45" r="15"/>
<circle class="c-page-bg" cx="585" cy="45" r="15"/>
<circle class="c-page-bg" cx="625" cy="45" r="15"/>
<circle class="c-page-bg" cx="665" cy="45" r="15"/>
<circle class="c-page-bg" cx="705" cy="45" r="15"/>
<circle class="c-page-bg" cx="745" cy="45" r="15"/>
<circle class="c-page-bg" cx="785" cy="45" r="15"/>
<circle class="c-page-bg" cx="825" cy="45" r="15"/>
<circle class="c-page-bg" cx="865" cy="45" r="15"/>
<circle class="c-page-bg" cx="905" cy="45" r="15"/>
</svg>
<div class="name"><h1><span>AI Native</span><br><span>Interface</span></h1><p>For AI Companies and ML Services</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
