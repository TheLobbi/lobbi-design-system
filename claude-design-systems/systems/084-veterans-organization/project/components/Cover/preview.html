<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&amp;family=Source+Sans+Pro:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-honor-gold{fill:var(--honor-gold);stroke:var(--honor-gold);stroke-width:0;}
.c-red-light{fill:var(--red-light);stroke:var(--red-light);stroke-width:0;}
.c-patriot-navy{fill:var(--patriot-navy);stroke:var(--patriot-navy);stroke-width:0;}
.c-navy-light{fill:var(--navy-light);stroke:var(--navy-light);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;top:136px;max-width:880px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:64px;line-height:0.92;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: honor-gold 14×5 steps, red-light 8×5 steps, patriot-navy 11×5 steps, navy-light 5×5 steps
  arrangement: top band of unequal strips (name too wide for its zone)
  pattern: rules — formal (8/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-md (24px), gap 8px, radius border-radius (4px)
-->
<rect class="c-honor-gold blk" x="0" y="0" width="335" height="112"/>
<rect class="c-red-light blk" x="343" y="0" width="198" height="112"/>
<rect class="c-patriot-navy blk" x="549" y="0" width="266" height="112"/>
<rect class="c-navy-light blk" x="823" y="0" width="129" height="112"/>
<line class="c-red-light rule" x1="0" y1="37" x2="960" y2="37"/>
<line class="c-red-light rule" x1="0" y1="75" x2="960" y2="75"/>
</svg>
<div class="name"><h1><span>Veterans Organization</span></h1><p>Veterans Organization 80% + Service Honor 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 880, min = 32;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
