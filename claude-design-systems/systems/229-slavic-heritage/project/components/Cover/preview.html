<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&amp;family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-matryoshka-gold{fill:var(--matryoshka-gold);stroke:var(--matryoshka-gold);stroke-width:0;}
.c-stat-card-text{fill:var(--stat-card-text);stroke:var(--stat-card-text);stroke-width:0;}
.c-btn-primary-bg{fill:var(--btn-primary-bg);stroke:var(--btn-primary-bg);stroke-width:0;}
.c-folk-blue{fill:var(--folk-blue);stroke:var(--folk-blue);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-6);}
.tile{rx:var(--radius-6);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:91px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--stone-gray);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: matryoshka-gold 6×13 steps, stat-card-text 4×11 steps, btn-primary-bg 3×13 steps, folk-blue 5×11 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: tiles — geometric, modular dashboard layouts → tiles cut by the radius tokens
  scales: step space-24 (24px), gap 8px, radius radius-6 (6px)
-->
<rect class="c-matryoshka-gold blk" x="816" y="-24" width="136" height="312"/>
<rect class="c-stat-card-text blk" x="720" y="48" width="88" height="264"/>
<rect class="c-btn-primary-bg blk" x="648" y="-24" width="64" height="312"/>
<rect class="c-folk-blue blk" x="528" y="48" width="112" height="264"/>
<rect class="c-page-bg tile" x="828" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="866" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="904" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="828" y="50" width="68" height="30"/>
<rect class="c-page-bg tile" x="904" y="50" width="30" height="30"/>
<rect class="c-page-bg tile" x="828" y="88" width="30" height="30"/>
<rect class="c-page-bg tile" x="866" y="88" width="30" height="30"/>
<rect class="c-page-bg tile" x="904" y="88" width="30" height="30"/>
<rect class="c-page-bg tile" x="828" y="126" width="68" height="30"/>
<rect class="c-page-bg tile" x="904" y="126" width="30" height="30"/>
<rect class="c-page-bg tile" x="828" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="866" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="904" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="828" y="202" width="68" height="30"/>
<rect class="c-page-bg tile" x="904" y="202" width="30" height="30"/>
<rect class="c-page-bg tile" x="828" y="240" width="30" height="30"/>
<rect class="c-page-bg tile" x="866" y="240" width="30" height="30"/>
<rect class="c-page-bg tile" x="904" y="240" width="30" height="30"/>
</svg>
<div class="name"><h1><span>Slavic</span><br><span>Heritage</span></h1><p>For Slavic Culture and Eastern European Heritage</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
