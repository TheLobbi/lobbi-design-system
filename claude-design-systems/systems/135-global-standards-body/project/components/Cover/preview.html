<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-international-blue{fill:var(--international-blue);stroke:var(--international-blue);stroke-width:0;}
.c-regulatory-navy{fill:var(--regulatory-navy);stroke:var(--regulatory-navy);stroke-width:0;}
.c-pending-amber{fill:var(--pending-amber);stroke:var(--pending-amber);stroke-width:0;}
.c-compliance-green{fill:var(--compliance-green);stroke:var(--compliance-green);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;top:136px;max-width:880px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:63px;line-height:0.92;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-secondary);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: international-blue 16×5 steps, regulatory-navy 9×5 steps, pending-amber 13×5 steps, compliance-green 6×5 steps
  arrangement: top band of unequal strips (name too wide for its zone)
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step space-3 (21px), gap 7px, radius radius-sm (4px)
-->
<rect class="c-international-blue blk" x="0" y="0" width="336" height="112"/>
<rect class="c-regulatory-navy blk" x="343" y="0" width="199" height="112"/>
<rect class="c-pending-amber blk" x="549" y="0" width="267" height="112"/>
<rect class="c-compliance-green blk" x="823" y="0" width="130" height="112"/>
<circle class="c-page-bg" cx="27" cy="27" r="16"/>
<circle class="c-page-bg" cx="70" cy="27" r="16"/>
<circle class="c-page-bg" cx="113" cy="27" r="16"/>
<circle class="c-page-bg" cx="156" cy="27" r="16"/>
<circle class="c-page-bg" cx="199" cy="27" r="16"/>
<circle class="c-page-bg" cx="242" cy="27" r="16"/>
<circle class="c-page-bg" cx="285" cy="27" r="16"/>
<circle class="c-page-bg" cx="27" cy="70" r="16"/>
<circle class="c-page-bg" cx="70" cy="70" r="16"/>
<circle class="c-page-bg" cx="113" cy="70" r="16"/>
<circle class="c-page-bg" cx="156" cy="70" r="16"/>
<circle class="c-page-bg" cx="199" cy="70" r="16"/>
</svg>
<div class="name"><h1><span>Global Standards Body</span></h1><p>For Global Standards and International Bodies</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 880, min = 32;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
