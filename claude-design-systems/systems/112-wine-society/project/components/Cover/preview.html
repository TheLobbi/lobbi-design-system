<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">

<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-gold-dark{fill:var(--gold-dark);stroke:var(--gold-dark);stroke-width:0;}
.c-gold-light{fill:var(--gold-light);stroke:var(--gold-light);stroke-width:0;}
.c-burgundy-dark{fill:var(--burgundy-dark);stroke:var(--burgundy-dark);stroke-width:0;}
.c-text-dark{fill:var(--text-dark);stroke:var(--text-dark);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-8);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: gold-dark 6×13 steps, gold-light 4×11 steps, burgundy-dark 3×13 steps, text-dark 5×11 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: rules — formal (8/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-24 (24px), gap 8px, radius radius-8 (8px)
-->
<rect class="c-gold-dark blk" x="816" y="-24" width="136" height="312"/>
<rect class="c-gold-light blk" x="720" y="48" width="88" height="264"/>
<rect class="c-burgundy-dark blk" x="648" y="-24" width="64" height="312"/>
<rect class="c-text-dark blk" x="528" y="48" width="112" height="264"/>
<line class="c-gold-light rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-gold-light rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-gold-light rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-gold-light rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>Wine</span><br><span>Society</span></h1><p>For Wine Clubs and Sommelier Societies</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
