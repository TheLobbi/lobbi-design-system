<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-gold-400{fill:var(--gold-400);stroke:var(--gold-400);stroke-width:0;}
.c-orange-500{fill:var(--orange-500);stroke:var(--orange-500);stroke-width:0;}
.c-green-700{fill:var(--green-700);stroke:var(--green-700);stroke-width:0;}
.c-purple-500{fill:var(--purple-500);stroke:var(--purple-500);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-15);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:78px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--gray-900);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: gold-400 19×4 steps, orange-500 16×4 steps, green-700 13×4 steps, purple-500 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: stripes — loud, low-formality (3/10) voice → stripes at a spacing pitch
  scales: step space-24 (24px), gap 8px, radius radius-15 (15px)
-->
<rect class="c-gold-400 blk" x="528" y="24" width="456" height="96"/>
<rect class="c-orange-500 blk" x="600" y="77" width="384" height="96"/>
<rect class="c-green-700 blk" x="672" y="130" width="312" height="96"/>
<rect class="c-purple-500 blk" x="744" y="182" width="240" height="96"/>
<rect class="c-page-bg" x="540" y="36" width="408" height="12"/>
<rect class="c-page-bg" x="540" y="60" width="408" height="12"/>
<rect class="c-page-bg" x="540" y="84" width="408" height="12"/>
</svg>
<div class="name"><h1><span>Brazilian</span><br><span>Carnival</span></h1><p>Joy, Movement &amp; Tropical Exuberance</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
