<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-pink{fill:var(--color-pink);stroke:var(--color-pink);stroke-width:0;}
.c-color-gold{fill:var(--color-gold);stroke:var(--color-gold);stroke-width:0;}
.c-color-black{fill:var(--color-black);stroke:var(--color-black);stroke-width:0;}
.c-hero-subtitle-text{fill:var(--hero-subtitle-text);stroke:var(--hero-subtitle-text);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-2);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:100;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-pink 6×13 steps, color-gold 4×11 steps, color-black 3×13 steps, hero-subtitle-text 5×11 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: rules — formal (8/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-md (24px), gap 8px, radius radius-2 (2px)
-->
<rect class="c-color-pink blk" x="816" y="-24" width="136" height="312"/>
<rect class="c-color-gold blk" x="720" y="48" width="88" height="264"/>
<rect class="c-color-black blk" x="648" y="-24" width="64" height="312"/>
<rect class="c-hero-subtitle-text blk" x="528" y="48" width="112" height="264"/>
<line class="c-color-gold rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-color-gold rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-color-gold rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-color-gold rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>Fashion</span><br><span>Magazine</span></h1><p>Fashion Magazine 80% + Vogue Elegance 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
