<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&amp;family=Spectral:wght@300;400;500;600;700&amp;family=Lora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-gold-dark{fill:var(--color-gold-dark);stroke:var(--color-gold-dark);stroke-width:0;}
.c-color-warm-gold{fill:var(--color-warm-gold);stroke:var(--color-warm-gold);stroke-width:0;}
.c-color-velvet-red{fill:var(--color-velvet-red);stroke:var(--color-velvet-red);stroke-width:0;}
.c-color-orchestra-black{fill:var(--color-orchestra-black);stroke:var(--color-orchestra-black);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:81px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-gold-dark 19×4 steps, color-warm-gold 16×4 steps, color-velvet-red 13×4 steps, color-orchestra-black 10×4 steps
  arrangement: staggered stack bleeding off the right edge
  pattern: rules — formal (10/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-sm (24px), gap 8px, radius border-radius (4px), hairline border-width
-->
<rect class="c-color-gold-dark blk" x="528" y="24" width="456" height="96"/>
<rect class="c-color-warm-gold blk" x="600" y="77" width="384" height="96"/>
<rect class="c-color-velvet-red blk" x="672" y="130" width="312" height="96"/>
<rect class="c-color-orchestra-black blk" x="744" y="182" width="240" height="96"/>
<line class="c-color-warm-gold rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-color-warm-gold rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-color-warm-gold rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-color-warm-gold rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>Symphonic</span><br><span>Orchestra</span></h1><p>For Orchestras and Concert Halls</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
