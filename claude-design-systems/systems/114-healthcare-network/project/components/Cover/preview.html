<!doctype html>
<html><head><meta charset="utf-8">

<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-primary-blue{fill:var(--primary-blue);stroke:var(--primary-blue);stroke-width:0;}
.c-medical-green{fill:var(--medical-green);stroke:var(--medical-green);stroke-width:0;}
.c-pending-status{fill:var(--pending-status);stroke:var(--pending-status);stroke-width:0;}
.c-expired-status{fill:var(--expired-status);stroke:var(--expired-status);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-sm);}
.tile{rx:var(--radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:66px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--dark-gray);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: primary-blue 8×13 steps, medical-green 9×4 steps, pending-status 9×3 steps, expired-status 9×4 steps
  arrangement: one tall slab with satellites
  pattern: tiles — geometric, modular dashboard layouts → tiles cut by the radius tokens
  scales: step space-lg (24px), gap 8px, radius radius-sm (4px)
-->
<rect class="c-primary-blue blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-medical-green blk" x="752" y="24" width="208" height="96"/>
<rect class="c-pending-status blk" x="752" y="128" width="208" height="72"/>
<rect class="c-expired-status blk" x="752" y="208" width="208" height="96"/>
<rect class="c-page-bg tile" x="564" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="602" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="640" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="678" y="12" width="30" height="30"/>
<rect class="c-page-bg tile" x="564" y="50" width="30" height="30"/>
<rect class="c-page-bg tile" x="602" y="50" width="30" height="30"/>
<rect class="c-page-bg tile" x="640" y="50" width="30" height="30"/>
<rect class="c-page-bg tile" x="678" y="50" width="30" height="30"/>
<rect class="c-page-bg tile" x="564" y="88" width="68" height="30"/>
<rect class="c-page-bg tile" x="640" y="88" width="30" height="30"/>
<rect class="c-page-bg tile" x="678" y="88" width="30" height="30"/>
<rect class="c-page-bg tile" x="564" y="126" width="30" height="30"/>
<rect class="c-page-bg tile" x="602" y="126" width="30" height="30"/>
<rect class="c-page-bg tile" x="640" y="126" width="68" height="30"/>
<rect class="c-page-bg tile" x="564" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="602" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="640" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="678" y="164" width="30" height="30"/>
<rect class="c-page-bg tile" x="564" y="202" width="68" height="30"/>
<rect class="c-page-bg tile" x="640" y="202" width="30" height="30"/>
<rect class="c-page-bg tile" x="678" y="202" width="30" height="30"/>
<rect class="c-page-bg tile" x="564" y="240" width="30" height="30"/>
<rect class="c-page-bg tile" x="602" y="240" width="30" height="30"/>
<rect class="c-page-bg tile" x="640" y="240" width="68" height="30"/>
</svg>
<div class="name"><h1><span>Healthcare</span><br><span>Network</span></h1><p>For Healthcare Networks and Medical Associations</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
