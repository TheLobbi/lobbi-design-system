<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-blush{fill:var(--color-blush);stroke:var(--color-blush);stroke-width:0;}
.c-color-dusty-blue{fill:var(--color-dusty-blue);stroke:var(--color-dusty-blue);stroke-width:0;}
.c-color-text{fill:var(--color-text);stroke:var(--color-text);stroke-width:0;}
.c-color-text-light{fill:var(--color-text-light);stroke:var(--color-text-light);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-16);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:73px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-blush 6×19 steps, color-dusty-blue 4×17 steps, color-text 3×19 steps, color-text-light 5×17 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: discs — soft, large-radius shapes → discs and pills cut from the radius scale
  scales: step space-sm (16px), gap 5px, radius radius-16 (16px)
-->
<rect class="c-color-blush blk" x="864" y="-16" width="91" height="304"/>
<rect class="c-color-dusty-blue blk" x="800" y="32" width="59" height="272"/>
<rect class="c-color-text blk" x="752" y="-16" width="43" height="304"/>
<rect class="c-color-text-light blk" x="672" y="32" width="75" height="272"/>
<circle class="c-page-bg" cx="884" cy="20" r="12"/>
<circle class="c-page-bg" cx="916" cy="20" r="12"/>
<circle class="c-page-bg" cx="884" cy="52" r="12"/>
<circle class="c-page-bg" cx="916" cy="52" r="12"/>
<circle class="c-page-bg" cx="884" cy="84" r="12"/>
<circle class="c-page-bg" cx="916" cy="84" r="12"/>
<circle class="c-page-bg" cx="884" cy="116" r="12"/>
<circle class="c-page-bg" cx="916" cy="116" r="12"/>
<circle class="c-page-bg" cx="884" cy="148" r="12"/>
<circle class="c-page-bg" cx="916" cy="148" r="12"/>
<circle class="c-page-bg" cx="884" cy="180" r="12"/>
<circle class="c-page-bg" cx="916" cy="180" r="12"/>
</svg>
<div class="name"><h1><span>Watercolor</span><br><span>Digital</span></h1><p>Watercolor Art 55% + Organic Flow 25% + Soft Pastel 20%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
