<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&amp;family=Montserrat:wght@300;400;500;600;700&amp;family=Cinzel:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-burgundy{fill:var(--burgundy);stroke:var(--burgundy);stroke-width:0;}
.c-gold-light{fill:var(--gold-light);stroke:var(--gold-light);stroke-width:0;}
.c-gold-dark{fill:var(--gold-dark);stroke:var(--gold-dark);stroke-width:0;}
.c-text-primary{fill:var(--text-primary);stroke:var(--text-primary);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:81px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-secondary);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: burgundy 8×13 steps, gold-light 9×4 steps, gold-dark 9×3 steps, text-primary 9×4 steps
  arrangement: one tall slab with satellites
  pattern: rules — formal (9/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-md (24px), gap 8px, radius border-radius (2px)
-->
<rect class="c-burgundy blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-gold-light blk" x="752" y="24" width="208" height="96"/>
<rect class="c-gold-dark blk" x="752" y="128" width="208" height="72"/>
<rect class="c-text-primary blk" x="752" y="208" width="208" height="96"/>
<line class="c-gold-light rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-gold-light rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-gold-light rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-gold-light rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>Luxury</span><br><span>Concierge</span></h1><p>Five-Star Hospitality 60% + Art Deco 25% + Editorial 15%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
