<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didot&amp;family=Cormorant+Garamond:wght@300;400;500;600;700&amp;family=Helvetica+Neue:wght@300;400;500;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-rose-gold{fill:var(--color-rose-gold);stroke:var(--color-rose-gold);stroke-width:0;}
.c-color-atelier-gray{fill:var(--color-atelier-gray);stroke:var(--color-atelier-gray);stroke-width:0;}
.c-color-couture-black{fill:var(--color-couture-black);stroke:var(--color-couture-black);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:300;font-size:98px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-atelier-gray);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-rose-gold 6×19 steps, color-atelier-gray 4×17 steps, color-couture-black 3×19 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: rules — formal (9/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-sm (16px), gap 5px, radius border-radius (2px), hairline border-width
-->
<rect class="c-color-rose-gold blk" x="864" y="-16" width="91" height="304"/>
<rect class="c-color-atelier-gray blk" x="800" y="32" width="59" height="272"/>
<rect class="c-color-couture-black blk" x="752" y="-16" width="43" height="304"/>
<line class="c-color-atelier-gray rule" x1="480" y1="32" x2="960" y2="32"/>
<line class="c-color-atelier-gray rule" x1="480" y1="64" x2="960" y2="64"/>
<line class="c-color-atelier-gray rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-color-atelier-gray rule" x1="480" y1="128" x2="960" y2="128"/>
</svg>
<div class="name"><h1><span>Haute</span><br><span>Couture</span></h1><p>High Fashion 55% + Parisian Elegance 30% + Art Gallery 15%</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
