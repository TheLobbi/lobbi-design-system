<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-link-blue{fill:var(--link-blue);stroke:var(--link-blue);stroke-width:0;}
.c-breaking-red{fill:var(--breaking-red);stroke:var(--breaking-red);stroke-width:0;}
.c-verified-green{fill:var(--verified-green);stroke:var(--verified-green);stroke-width:0;}
.c-ink-black{fill:var(--ink-black);stroke:var(--ink-black);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-2);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:81px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: link-blue 8×13 steps, breaking-red 9×4 steps, verified-green 9×3 steps, ink-black 9×4 steps
  arrangement: one tall slab with satellites
  pattern: rules — formal (8/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-lg (24px), gap 8px, radius radius-2 (2px), hairline border-width
-->
<rect class="c-link-blue blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-breaking-red blk" x="752" y="24" width="208" height="96"/>
<rect class="c-verified-green blk" x="752" y="128" width="208" height="72"/>
<rect class="c-ink-black blk" x="752" y="208" width="208" height="96"/>
<line class="c-breaking-red rule" x1="480" y1="48" x2="960" y2="48"/>
<line class="c-breaking-red rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-breaking-red rule" x1="480" y1="144" x2="960" y2="144"/>
<line class="c-breaking-red rule" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div class="name"><h1><span>News</span><br><span>Editorial</span></h1><p>Premium News Publication</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
