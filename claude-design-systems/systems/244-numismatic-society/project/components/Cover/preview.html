<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Libre+Franklin:wght@300;400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-patina-green{fill:var(--color-patina-green);stroke:var(--color-patina-green);stroke-width:0;}
.c-color-deep-gold{fill:var(--color-deep-gold);stroke:var(--color-deep-gold);stroke-width:0;}
.c-color-velvet-burgundy{fill:var(--color-velvet-burgundy);stroke:var(--color-velvet-burgundy);stroke-width:0;}
.c-color-rich-gold{fill:var(--color-rich-gold);stroke:var(--color-rich-gold);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius-sm);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:73px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-patina-green 6×15 steps, color-deep-gold 4×13 steps, color-velvet-burgundy 3×15 steps, color-rich-gold 5×13 steps
  arrangement: strip of unequal bands bleeding off the top
  pattern: rules — formal (9/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-md (20px), gap 7px, radius border-radius-sm (4px)
-->
<rect class="c-color-patina-green blk" x="840" y="-20" width="113" height="308"/>
<rect class="c-color-deep-gold blk" x="760" y="40" width="73" height="268"/>
<rect class="c-color-velvet-burgundy blk" x="700" y="-20" width="53" height="308"/>
<rect class="c-color-rich-gold blk" x="600" y="40" width="93" height="268"/>
<line class="c-color-deep-gold rule" x1="480" y1="40" x2="960" y2="40"/>
<line class="c-color-deep-gold rule" x1="480" y1="80" x2="960" y2="80"/>
<line class="c-color-deep-gold rule" x1="480" y1="120" x2="960" y2="120"/>
<line class="c-color-deep-gold rule" x1="480" y1="160" x2="960" y2="160"/>
</svg>
<div class="name"><h1><span>Numismatic</span><br><span>Society</span></h1><p>For Coin Collectors and Numismatic Societies</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
