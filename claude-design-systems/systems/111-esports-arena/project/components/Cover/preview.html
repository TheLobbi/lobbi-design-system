<!doctype html>
<html><head><meta charset="utf-8">

<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-electric-cyan{fill:var(--electric-cyan);stroke:var(--electric-cyan);stroke-width:0;}
.c-accent-gold{fill:var(--accent-gold);stroke:var(--accent-gold);stroke-width:0;}
.c-accent-red{fill:var(--accent-red);stroke:var(--accent-red);stroke-width:0;}
.c-accent-green{fill:var(--accent-green);stroke:var(--accent-green);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--radius-4);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:95px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-secondary);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: electric-cyan 8×13 steps, accent-gold 9×4 steps, accent-red 9×3 steps, accent-green 9×4 steps
  arrangement: one tall slab with satellites
  pattern: stripes — loud, low-formality (3/10) voice → stripes at a spacing pitch
  scales: step spacing-md (24px), gap 8px, radius radius-4 (4px)
-->
<rect class="c-electric-cyan blk" x="552" y="-24" width="192" height="312"/>
<rect class="c-accent-gold blk" x="752" y="24" width="208" height="96"/>
<rect class="c-accent-red blk" x="752" y="128" width="208" height="72"/>
<rect class="c-accent-green blk" x="752" y="208" width="208" height="96"/>
<rect class="c-page-bg" x="564" y="12" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="36" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="60" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="84" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="108" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="132" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="156" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="180" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="204" width="168" height="12"/>
<rect class="c-page-bg" x="564" y="228" width="168" height="12"/>
</svg>
<div class="name"><h1><span>eSports</span><br><span>Arena</span></h1><p>For Esports Teams and Gaming Leagues</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
