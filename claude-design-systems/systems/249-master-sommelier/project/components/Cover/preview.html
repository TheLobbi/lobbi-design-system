<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&amp;family=Crimson+Text:wght@400;600;700&amp;family=Lato:wght@300;400;700&amp;display=swap">
<style>
body{margin:0;background:var(--page-bg);color:var(--page-text);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page-bg);}
svg{position:absolute;inset:0;}
.c-color-vintage-gold{fill:var(--color-vintage-gold);stroke:var(--color-vintage-gold);stroke-width:0;}
.c-color-burgundy{fill:var(--color-burgundy);stroke:var(--color-burgundy);stroke-width:0;}
.c-color-oak-barrel{fill:var(--color-oak-barrel);stroke:var(--color-oak-barrel);stroke-width:0;}
.c-page-bg{fill:var(--page-bg);stroke:var(--page-bg);stroke-width:0;}
.blk{rx:var(--border-radius);}
.rule{stroke-width:1px;fill:none;}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;}
.name h1 span{display:inline-block;white-space:nowrap;}
.name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:81px;line-height:0.95;color:var(--page-text);letter-spacing:0;}
.name p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--page-text);}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
  blocks: color-vintage-gold 8×19 steps, color-burgundy 19×4 steps, color-oak-barrel 19×3 steps
  arrangement: one tall slab with satellites
  pattern: rules — formal (9/10) serif editorial voice → a few hairline rules crossing the blocks
  scales: step space-sm (16px), gap 5px, radius border-radius (3px), hairline border-width
-->
<rect class="c-color-vintage-gold blk" x="528" y="-16" width="128" height="304"/>
<rect class="c-color-burgundy blk" x="661" y="16" width="299" height="64"/>
<rect class="c-color-oak-barrel blk" x="661" y="85" width="299" height="48"/>
<line class="c-color-burgundy rule" x1="480" y1="32" x2="960" y2="32"/>
<line class="c-color-burgundy rule" x1="480" y1="64" x2="960" y2="64"/>
<line class="c-color-burgundy rule" x1="480" y1="96" x2="960" y2="96"/>
<line class="c-color-burgundy rule" x1="480" y1="128" x2="960" y2="128"/>
</svg>
<div class="name"><h1><span>Master</span><br><span>Sommelier</span></h1><p>For Sommelier Guilds and Wine Societies</p></div>
</div>
<script>
// Real faces run wider or narrower than the estimate: shrink the name until each line fits its zone.
(function () {
  var h = document.querySelector('.name h1'), max = 440, min = 48;
  var lines = h.querySelectorAll('span');
  function fit() {
    var s = parseFloat(getComputedStyle(h).fontSize);
    for (var i = 0; i < lines.length; i++) while (s > min && lines[i].getBoundingClientRect().width > max) { s -= 2; h.style.fontSize = s + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body></html>
